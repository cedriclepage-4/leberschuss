{# Het Tonzent-logo als 3D-voorwerp (vis op een ruit). Gedeeld door de
   thuispagina en de inschrijfpagina; thuis.js laat het kantelen en wiegen. #}
    <div class="logo3d" aria-hidden="true">
      <div class="logo3d-gloed"></div>
      <div class="logo3d-binnen">
        <svg class="laag laag-schaduw" viewBox="0 0 100 100">
          <defs><clipPath id="l3d-zone"><polygon points="46,6 86,46 46,86 6,46"/></clipPath></defs>
          <g clip-path="url(#l3d-zone)">
            <polygon points="46,6 86,46 46,86 6,46" fill="#9c9c9c"/>
            <g stroke="#ffffff" stroke-width="1.6">
              <line x1="0" y1="22" x2="100" y2="22"/><line x1="0" y1="34" x2="100" y2="34"/>
              <line x1="0" y1="46" x2="100" y2="46"/><line x1="0" y1="58" x2="100" y2="58"/>
              <line x1="0" y1="70" x2="100" y2="70"/><line x1="24" y1="10" x2="24" y2="22"/>
              <line x1="40" y1="22" x2="40" y2="34"/><line x1="18" y1="34" x2="18" y2="46"/>
              <line x1="34" y1="46" x2="34" y2="58"/><line x1="26" y1="58" x2="26" y2="70"/>
            </g>
          </g>
        </svg>
        {% for z in range(7) %}<svg class="laag laag-dikte" style="--z: {{ -2 - z * 2 }}px" viewBox="0 0 100 100"><polygon points="52,10 92,50 52,90 12,50"/></svg>{% endfor %}
        <svg class="laag laag-ruit" viewBox="0 0 100 100">
          <defs><linearGradient id="l3d-glans" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
          </linearGradient></defs>
          <polygon points="52,10 92,50 52,90 12,50" fill="#0b0b0b"/>
          <polygon points="52,10 92,50 52,90 12,50" fill="url(#l3d-glans)"/>
        </svg>
        <svg class="laag laag-vis" viewBox="0 0 100 100">
          <g fill="#ffffff">
            <path d="M24 50 C 33 39, 52 36.5, 62 43 C 65.5 45.2, 67.5 47.8, 67.5 50 C 67.5 52.2, 65.5 54.8, 62 57 C 52 63.5, 33 61, 24 50 Z"/>
            <path class="vis-staart" d="M61 50 L 76.5 36.5 C 79.5 34.2, 81 35.2, 79.8 38.2 L 73.2 50 L 79.8 61.8 C 81 64.8, 79.5 65.8, 76.5 63.5 Z"/>
          </g>
          <circle cx="36.5" cy="48.2" r="4.6" fill="#0b0b0b"/>
        </svg>
      </div>
    </div>
